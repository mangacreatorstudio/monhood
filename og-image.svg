<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e14"/>
      <stop offset="100%" style="stop-color:#12161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#5b8fff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines subtle -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1a2030" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1a2030" stroke-width="1"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="180" fill="none" stroke="#f7931a" stroke-width="1" opacity="0.12"/>
  <circle cx="1050" cy="100" r="120" fill="none" stroke="#f7931a" stroke-width="1" opacity="0.10"/>
  <circle cx="150" cy="530" r="140" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.10"/>
  <!-- Logo box -->
  <rect x="80" y="80" width="80" height="80" rx="20" fill="url(#accent)"/>
  <text x="120" y="143" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">M</text>
  <!-- Brand name -->
  <text x="180" y="127" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="48" font-weight="900" fill="white" letter-spacing="-2">Monhood</text>
  <!-- Tagline -->
  <text x="80" y="300" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="62" font-weight="800" fill="white" letter-spacing="-3">Real-Time Meme Coin</text>
  <text x="80" y="375" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="62" font-weight="800" fill="url(#accent)" letter-spacing="-3">Scanner &amp; AI Scoring</text>
  <!-- Description -->
  <text x="80" y="450" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="28" fill="#8b95a5">Monitor Robinhood Chain, BSC &amp; Base · Powered by Clawby API</text>
  <!-- Chain badges -->
  <rect x="80" y="505" width="160" height="44" rx="10" fill="#1a2030" stroke="#f7931a" stroke-width="1.5"/>
  <text x="160" y="532" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" font-weight="700" fill="#f7931a" text-anchor="middle">🦬 Robinhood</text>
  <rect x="258" y="505" width="120" height="44" rx="10" fill="#1a2030" stroke="#f0b90b" stroke-width="1.5"/>
  <text x="318" y="532" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" font-weight="700" fill="#f0b90b" text-anchor="middle">⬡ BSC</text>
  <rect x="396" y="505" width="120" height="44" rx="10" fill="#1a2030" stroke="#5b8fff" stroke-width="1.5"/>
  <text x="456" y="532" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" font-weight="700" fill="#5b8fff" text-anchor="middle">🔵 Base</text>
  <!-- URL -->
  <text x="1120" y="590" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" fill="#4a9eff" text-anchor="end">moonhood.fun</text>
</svg>
