<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your account — Monhood</title>
  <meta name="description" content="Manage your Monhood account.">
  <link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/site.css">
</head>
<body>
  <div class="site-shell">
    <nav class="site-nav"><a class="brand" href="/"><img src="/logo.svg" alt="">Monhood</a><div class="site-links"><a href="/">Dashboard</a><a href="/about">About</a><a href="/credentials">Credentials</a></div><div class="auth-links" data-auth-links></div></nav>
    <main class="page" data-account>
      <section class="account-card card">
        <div data-account-loading>Loading your account…</div>
        <div data-account-content data-hidden>
          <div class="profile-row"><div class="avatar" data-avatar>MH</div><div class="profile-meta"><h2 data-user-name>Monhood user</h2><p data-user-email></p></div></div>
          <p class="lede">Your account is managed securely by Clerk. Your local API credentials remain separate from this profile.</p>
          <div class="account-actions"><a class="button primary" href="/">Open dashboard</a><button class="button ghost" type="button" data-account-sign-out>Sign out</button></div>
        </div>
      </section>
    </main>
  </div>
  <script>window.MONHOOD_AUTH={publishableKey:__CLERK_PUBLISHABLE_KEY__,basePath:""};</script>
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script><script src="/site.js"></script>
</body>
</html>
